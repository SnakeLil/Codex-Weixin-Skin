name: 功能建议 / Feature request
description: 建议新的主题细节、页面适配或使用体验
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 你希望解决什么问题？
      description: 请描述当前体验以及它为什么值得改进。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可以附上微信参考截图、交互说明或效果草图。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 其他可选方案
      description: 如果考虑过不同做法，请一并说明。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同建议。
          required: true
        - label: 该建议与 Codex 微信主题的界面或使用体验直接相关。
          required: true
